name: Build SR SmartReply AI APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Find and extract Android source archive
        shell: bash
        run: |
          set -euo pipefail
          if [ -f settings.gradle ] && [ -d app ]; then
            echo 'Source already extracted.'
          else
            ZIP=$(find . -maxdepth 2 -type f -name '*.zip' | sort | head -n 1)
            if [ -z "$ZIP" ]; then echo 'ERROR: Upload the source ZIP to repository root.'; exit 1; fi
            mkdir -p /tmp/sr-source
            unzip -q "$ZIP" -d /tmp/sr-source
            PROJECT=$(find /tmp/sr-source -maxdepth 4 -type f -name settings.gradle | head -n 1)
            if [ -z "$PROJECT" ]; then echo 'ERROR: settings.gradle not found in ZIP'; exit 1; fi
            SRC=$(dirname "$PROJECT")
            cp -a "$SRC"/. .
          fi
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 34 SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'
      - name: Configure Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Run JVM unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Check APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SR-SmartReply-AI-v4.3.2-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
