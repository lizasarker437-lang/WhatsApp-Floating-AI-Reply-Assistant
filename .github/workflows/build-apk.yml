name: Build Android APK (SR SmartReply AI v4.1.0)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Repository Checkout
        uses: actions/checkout@v4

      - name: 2. Smart Auto-Extract Source ZIP
        run: |
          if [ ! -f "settings.gradle" ] && [ ! -f "SRSmartReplyAI/settings.gradle" ]; then
            BEST_ZIP=""
            BEST_VER=-1
            for z in $(find . -maxdepth 2 -name "*.zip"); do
              VER=$(unzip -p "$z" "*/app/build.gradle" "app/build.gradle" 2>/dev/null | grep -E "versionCode[[:space:]]+[0-9]+" | awk '{print $2}' | head -n 1)
              if [ -z "$VER" ]; then
                VER=0
              fi
              if [ "$VER" -gt "$BEST_VER" ]; then
                BEST_VER=$VER
                BEST_ZIP="$z"
              fi
            done
            if [ -n "$BEST_ZIP" ]; then
              rm -rf extracted_project
              unzip -oq "$BEST_ZIP" -d extracted_project
            fi
          fi

      - name: 3. Locate Android Project Directory
        id: locate
        run: |
          if [ -f "settings.gradle" ]; then
            echo "project_dir=." >> $GITHUB_OUTPUT
          elif [ -f "SRSmartReplyAI/settings.gradle" ]; then
            echo "project_dir=SRSmartReplyAI" >> $GITHUB_OUTPUT
          else
            FOUND=$(find extracted_project . -maxdepth 3 -name "settings.gradle" 2>/dev/null | head -n 1)
            if [ -z "$FOUND" ]; then
              echo "ERROR: settings.gradle not found!"
              exit 1
            fi
            DIR=$(dirname "$FOUND")
            echo "project_dir=$DIR" >> $GITHUB_OUTPUT
          fi

      - name: 4. JDK 17 Setup
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Configure Android SDK & Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name "sdkmanager" 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          fi

      - name: 6. Gradle 8.6 Setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: 7. Apply v4.1.0 Three-Dot Menu Settings & Instant PIN Unlock Upgrade
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          python3 - << 'PYEOF'
          import os, re

          bg_path = "app/build.gradle"
          if os.path.exists(bg_path):
              bg = open(bg_path).read()
              bg = re.sub(r"versionCode\s+\d+", "versionCode 20", bg)
              bg = re.sub(r'versionName\s+"[^"]+"', 'versionName "4.1.0"', bg)
              open(bg_path, "w").write(bg)

          acc_xml = """<?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeWindowsChanged|typeNotificationStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_service_description"
              android:notificationTimeout="50" />
          """
          open("app/src/main/res/xml/accessibility_service_config.xml", "w").write(acc_xml.strip() + "\n")

