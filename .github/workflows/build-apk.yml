          svc_code = open(svc_path).read()

          helper_methods = """
              fun triggerImmediateUnlockAndOpenWhatsApp(targetName: String, contentIntent: PendingIntent?) {
                  onWhatsAppNotificationArrived(
                      senderTitle = targetName,
                      messageText = " ManualTrigger ",
                      contentIntent = contentIntent,
                      packageName = "com.whatsapp"
                  )
              }
          """

          if "triggerImmediateUnlockAndOpenWhatsApp" not in svc_code:
              svc_code = svc_code.replace(
                  "fun onWhatsAppNotificationArrived(",
                  helper_methods + "\n    fun onWhatsAppNotificationArrived("
              )

          notif_event_hook = """
                  if (event.eventType == AccessibilityEvent.TYPE_NOTIFICATION_STATE_CHANGED) {
                      val notif = event.parcelableData as? Notification
                      if (pkg == "com.whatsapp" || pkg == "com.whatsapp.w4b") {
                          val extras = notif?.extras
                          val title = extras?.getCharSequence(Notification.EXTRA_TITLE)?.toString()?.trim() ?: ""
                          val text = extras?.getCharSequence(Notification.EXTRA_TEXT)?.toString()?.trim() ?: ""
                          if (text.isNotEmpty() && !title.equals("WhatsApp", ignoreCase = true)) {
                              onWhatsAppNotificationArrived(
                                  senderTitle = title,
                                  messageText = text,
                                  contentIntent = notif?.contentIntent,
                                  packageName = pkg
                              )
                          }
                      }
                      return
                  }
          """

          if "TYPE_NOTIFICATION_STATE_CHANGED" not in svc_code:
              svc_code = svc_code.replace(
                  "val pkg = event.packageName?.toString() ?: return",
                  "val pkg = event.packageName?.toString() ?: return\n" + notif_event_hook
              )

          open(svc_path, "w").write(svc_code)
          print("Successfully upgraded project to v4.1.0 (versionCode 20)")
