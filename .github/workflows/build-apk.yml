              private fun refreshStatusSummary() {
                  val accOn = isAccessibilityEnabled()
                  val notifOn = isNotificationListenerEnabled()
                  val tvTitle = findViewById<TextView>(R.id.tvServiceStatusTitle)
                  val tvDesc = findViewById<TextView>(R.id.tvServiceStatusDesc)
                  val tvSummary = findViewById<TextView>(R.id.tvDashboardSummary)

                  if (accOn && notifOn) {
                      tvTitle.text = "✅ অটো আনলক ও AI সার্ভিস সক্রিয়"
                      tvDesc.text = "নোটিফিকেশন আসামাত্র পিন আনলক ও হোয়াটসঅ্যাপ ওপেন প্রস্তুত"
                  } else if (accOn) {
                      tvTitle.text = "⚠️ Notification Access চালু করুন"
                      tvDesc.text = "দ্রুত নোটিফিকেশন শনাক্ত করতে Notification বাটনে চাপুন"
                  } else {
                      tvTitle.text = "❌ Accessibility সার্ভিস বন্ধ আছে"
                      tvDesc.text = "অটো লক খোলা ও রিপ্লাইয়ের জন্য Accessibility চালু করুন"
                  }

                  val pinSet = settings.getPhoneLockPin().isNotEmpty()
                  val pinStatus = if (settings.isAutoUnlockEnabled() && pinSet) {
                      "🔓 অটো পিন আনলক: চালু (${settings.getPhoneLockPin().length} ডিজিট পিন সেট করা আছে)"
                  } else if (settings.isAutoUnlockEnabled()) {
                      "⚠️ অটো পিন আনলক: পিন দেওয়া হয়নি (⋮ মেনু > Settings থেকে পিন দিন)"
                  } else {
                      "🔒 অটো পিন আনলক: বন্ধ আছে"
                  }

                  val target = settings.getTargetContact().trim()
                  val targetStatus = if (settings.isTargetFilterEnabled() && target.isNotEmpty()) {
                      "🎯 টার্গেট চ্যাট: $target"
                  } else {
                      "🌐 টার্গেট চ্যাট: সকল ইনকামিং হোয়াটসঅ্যাপ মেসেজ"
                  }

                  val autoReplyStatus = if (settings.isAutoReplyEnabled()) "🤖 অটো-রিপ্লাই: চালু" else "⏸️ অটো-রিপ্লাই: বন্ধ"
                  tvSummary.text = "$pinStatus\\n$targetStatus\\n$autoReplyStatus"
              }

              private fun verifyGeminiStatusOnStart() {
                  val banner = findViewById<TextView>(R.id.tvConnectionBanner)
                  val key = settings.getGeminiApiKey()
                  banner.text = "🔄 Gemini AI সংযোগ পরীক্ষা করা হচ্ছে..."
                  uiScope.launch {
                      val check = withContext(Dispatchers.IO) {
                          GeminiReplyClient.verifyGeminiConnection(key)
                      }
                      if (check.connected) {
                          banner.text = "✅ স্ট্যাটাস: Gemini AI সংযুক্ত (${check.modelUsed} • ${check.latencyMs}ms)"
                      } else {
                          banner.text = "⚠️ স্ট্যাটাস: ${check.message}"
                      }
                  }
              }

              private fun runLiveReplyTest() {
                  val input = findViewById<EditText>(R.id.etTestMessage).text.toString().trim()
                  if (input.isEmpty()) return
                  val progress = findViewById<ProgressBar>(R.id.progressLiveTest)
                  val resultBox = findViewById<TextView>(R.id.tvLiveTestResult)
                  val banner = findViewById<TextView>(R.id.tvConnectionBanner)
                  progress.visibility = View.VISIBLE
                  resultBox.text = "📤 Gemini-এর কাছে মেসেজ পাঠানো হচ্ছে..."

                  val startMs = System.currentTimeMillis()
                  uiScope.launch {
                      val res = withContext(Dispatchers.IO) {
                          GeminiReplyClient.generateContextualReply(
                              chatHistory = listOf(ChatMessage(text = input, isIncoming = true, timestamp = startMs)),
                              apiKey = settings.getGeminiApiKey(),
                              languagePref = settings.getLanguagePreference(),
                              recentReplies = emptyList(),
                              contactName = settings.getTargetContact().ifEmpty { "Friend" }
                          )
                      }
                      progress.visibility = View.GONE
                      val elapsed = System.currentTimeMillis() - startMs
                      if (res.isLiveAi && res.singleReply.isNotBlank()) {
                          banner.text = "✅ স্ট্যাটাস: Gemini AI ১০০% সচল (${elapsed}ms)"
                          resultBox.text = "💬 ইনকামিং: $input\\n🤖 AI রিপ্লাই: ${res.singleReply}\\n⚡ সময়: ${elapsed}ms"
                      } else {
                          resultBox.text = "❌ ত্রুটি: ${res.errorMessage}"
                      }
                  }
              }

              private fun isAccessibilityEnabled(): Boolean {
                  val expected = ComponentName(this, WhatsAppAccessibilityService::class.java)
                  val enabled = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
                  return enabled.split(':').any { ComponentName.unflattenFromString(it) == expected }
              }

              private fun isNotificationListenerEnabled(): Boolean {
                  val flat = Settings.Secure.getString(contentResolver, "enabled_notification_listeners") ?: return false
                  return flat.contains(packageName)
              }

