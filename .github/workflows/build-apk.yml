          notif_kt = """package com.srcreationfarm.smartreplyai.service

          import android.app.Notification
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import com.srcreationfarm.smartreplyai.manager.SettingsManager

          class WhatsAppNotificationListener : NotificationListenerService() {

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  val notificationPkg = sbn?.packageName ?: return
                  if (notificationPkg != "com.whatsapp" && notificationPkg != "com.whatsapp.w4b") return

                  val settings = SettingsManager(applicationContext)
                  if (notificationPkg == "com.whatsapp.w4b" && !settings.isWhatsAppBusinessEnabled()) return

                  val extras = sbn.notification?.extras ?: return
                  val rawTitle = extras.getCharSequence(Notification.EXTRA_TITLE)?.toString()?.trim() ?: ""
                  val rawText = extras.getCharSequence(Notification.EXTRA_TEXT)?.toString()?.trim() ?: ""

                  if (rawText.isEmpty()) return
                  val lowerTitle = rawTitle.lowercase()
                  if (lowerTitle == "whatsapp" || lowerTitle == "whatsapp business" || lowerTitle == "you") return
                  if (rawText.contains("new messages", ignoreCase = true) ||
                      rawText.contains("checking for new messages", ignoreCase = true) ||
                      rawText.contains("backup in progress", ignoreCase = true)
                  ) {
                      return
                  }

                  val senderName = rawTitle.substringBefore("(").substringBefore(":").trim()
                  if (settings.isTargetFilterEnabled() && settings.getTargetContact().isNotBlank()) {
                      if (!settings.matchesTargetContact(senderName) && !settings.matchesTargetContact(rawTitle)) {
                          return
                      }
                  }

                  val contentIntent = sbn.notification?.contentIntent
                  val service = WhatsAppAccessibilityService.instance
                  if (service != null) {
                      service.onWhatsAppNotificationArrived(
                          senderTitle = senderName.ifEmpty { rawTitle },
                          messageText = rawText,
                          contentIntent = contentIntent,
                          packageName = notificationPkg
                      )
                  }
              }
          }
